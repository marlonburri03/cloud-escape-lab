<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* ── Design tokens ────────────────────────────────────────── */
    :root {
      --blue:    #0078D4;
      --blue-hv: #106EBE;
      --cyan:    #22D3EE;
      --navy:    #0F172A;
      --surface: #1E293B;
      --border:  rgba(255,255,255,0.08);
      --text:    #F1F5F9;
      --muted:   #94A3B8;
      --radius:  10px;
      --font:    'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Reset ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ─────────────────────────────────────────────────── */
    body {
      font-family: var(--font);
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      font-size: 0.9375rem;
    }

    /* ── App shell ────────────────────────────────────────────── */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── Header ───────────────────────────────────────────────── */
    .site-header {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .site-header .logo-icon {
      width: 32px; height: 32px;
      background: var(--blue);
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 1rem; color: #fff;
      flex-shrink: 0;
    }
    .site-header .logo-text {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .site-header .logo-text span { color: var(--cyan); }
    .site-header .header-right {
      margin-left: auto;
    }
    .site-header .header-right img {
      height: 36px;
      width: auto;
      display: block;
    }

    /* ── Main content ─────────────────────────────────────────── */
    .site-main { flex: 1; }

    /* ── Shared link style ────────────────────────────────────── */
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Shared button ────────────────────────────────────────── */
    a.btn, button.btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: .55rem 1.25rem;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      border-radius: var(--radius);
      border: none;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms;
    }
    a.btn:hover, button.btn:hover { background: var(--blue-hv); text-decoration: none; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a href="/" style="display:flex;align-items:center;gap:.625rem;text-decoration:none">
        <div class="logo-icon"><i class="bi bi-cloud-fill"></i></div>
        <span class="logo-text">Cloud<span>Escape</span> Lab</span>
      </a>
      <div class="header-right">
        <img src="{{ url_for('static', filename='img/brand_logo.png') }}" alt="Contoso University">
      </div>
    </header>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
