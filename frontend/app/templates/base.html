<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
    a.btn { display: inline-block; padding: .6rem 1.2rem; background: #0a5; color: white; text-decoration: none; border-radius: 4px; }
    header { border-bottom: 1px solid #ccc; margin-bottom: 2rem; padding-bottom: 1rem; }
  </style>
</head>
<body>
  <header><strong>{{ title }}</strong></header>
  {% block content %}{% endblock %}
</body>
</html>
