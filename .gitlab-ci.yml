stages:
  - lint
  - build
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  tags:
    - saas-linux-small-amd64
  interruptible: true

.rules-python: &rules-python
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml

.rules-terraform: &rules-terraform
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bootstrap/**/*
        - infra/**/*
        - .gitlab-ci.yml

.rules-docker: &rules-docker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/Dockerfile
        - frontend/**/*
        - .gitlab-ci.yml

# Stage 1: Lint, Validate and Secret Scan
python-lint:
  <<: *rules-python
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check frontend/

terraform-fmt-validate:
  <<: *rules-terraform
  stage: lint
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive bootstrap/ infra/
    - cd infra && terraform init -backend=false && terraform validate
    - cd ../bootstrap && terraform init -backend=false && terraform validate

dockerfile-lint:
  <<: *rules-docker
  stage: lint
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint frontend/Dockerfile

secret-scan:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact --no-banner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Stage 2: Build
frontend-docker-build:
  <<: *rules-docker
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t "$IMAGE_TAG" frontend/
    # Push only on main (to GitLab Container Registry)
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
      fi

terraform-plan:
  <<: *rules-terraform
  stage: build
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd infra
    - terraform init -backend=false
    - terraform plan -input=false -lock=false || true
  artifacts:
    when: always
    paths:
      - infra/plan.txt
    expire_in: 1 week

# Stage 3: Test
python-test:
  <<: *rules-python
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r frontend/requirements.txt
    - pip install --quiet pytest pytest-cov
  script:
    - |
      if [ -d "frontend/tests" ]; then
        cd frontend && pytest --cov=app --cov-report=term --cov-report=xml
      else
        echo "No tests found, skipping step."
      fi
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage.xml
    expire_in: 1 week
