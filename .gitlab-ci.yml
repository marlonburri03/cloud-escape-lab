stages:
  - lint
  - build
  - test
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

variables:
  ACR_NAME: "acrlabprodescape"
  ARM_CLIENT_ID: "00000000-0000-0000-0000-000000000003"
  ARM_TENANT_ID: "00000000-0000-0000-0000-000000000001"
  ARM_SUBSCRIPTION_ID: "00000000-0000-0000-0000-000000000002"

default:
  tags:
    - saas-linux-small-amd64
  interruptible: true

# reusable rule sets (jobs always run on main)
# on mrs only when the respective files changed
.rules-python: &rules-python
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml

.rules-terraform: &rules-terraform
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bootstrap/**/*
        - infra/**/*
        - .gitlab-ci.yml

.rules-docker-frontend: &rules-docker-frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/Dockerfile
        - frontend/**/*
        - .gitlab-ci.yml

.rules-docker-backend: &rules-docker-backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/Dockerfile
        - backend/**/*
        - .gitlab-ci.yml

# stage 1: lint
# checks python code in frontend/ for style issues, unused imports and bugs
python-lint:
  <<: *rules-python
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check frontend/

# base template for all terraform jobs, authenticates against azure via oidc
.terraform-base: &terraform-base
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    ARM_USE_OIDC: "true"
    TF_IN_AUTOMATION: "true"

# checks terraform code for correct formatting and syntactic validity
terraform-fmt-validate:
  <<: [*rules-terraform, *terraform-base]
  stage: lint
  script:
    - terraform fmt -check -recursive bootstrap/ infra/
    - cd infra && terraform init -input=false && terraform validate
    - cd ../bootstrap && terraform init -input=false && terraform validate

# checks both dockerfiles for best-practice violations (e.g. missing version pins, root user)
dockerfile-lint:
  stage: lint
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint frontend/Dockerfile
    - hadolint backend/Dockerfile
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/Dockerfile
        - backend/Dockerfile
        - .gitlab-ci.yml

# advanced terraform linting with azure-specific rules (deprecated resource types, missing tags)
tflint:
  <<: *rules-terraform
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - tflint --init -c "$CI_PROJECT_DIR/.tflint.hcl"
    - tflint -c "$CI_PROJECT_DIR/.tflint.hcl" --chdir=infra
    - tflint -c "$CI_PROJECT_DIR/.tflint.hcl" --chdir=bootstrap

# scans the whole repo for known cves in dependencies, iac misconfigurations and accidentally committed secrets
trivy-fs:
  stage: lint
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 --scanners vuln,misconfig,secret .
  cache:
    paths:
      - .trivycache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# stage 2: build
# builds the frontend docker image, on main the image is also pushed to the gitlab container registry
frontend-docker-build:
  <<: *rules-docker-frontend
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t "$IMAGE_TAG" frontend/
    # push only on main (to gitlab container registry)
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
      fi

# scans the built frontend container image for known cves (high/critical), only runs on main where the image was pushed
trivy-image:
  stage: build
  needs: [frontend-docker-build]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | trivy registry login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 "$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# builds the backend docker image, on main the image is also pushed to the gitlab container registry
backend-docker-build:
  <<: *rules-docker-backend
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t "$IMAGE_TAG" backend/
    # push only on main (to gitlab container registry)
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
      fi

# scans the built backend container image for known cves (high/critical), only runs on main where the image was pushed
trivy-image-backend:
  stage: build
  needs: [backend-docker-build]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | trivy registry login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 "$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# base template for acr build jobs – authenticates against azure via oidc and uses az acr build
.acr-build-base: &acr-build-base
  stage: build
  image: mcr.microsoft.com/azure-cli
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: https://gitlab.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# builds the frontend image and pushes it directly to acr
frontend-acr-build:
  <<: *acr-build-base
  script:
    - az login --service-principal --username "$ARM_CLIENT_ID" --federated-token "$ARM_OIDC_TOKEN" --tenant "$ARM_TENANT_ID"
    - az acr build --registry "$ACR_NAME" --image "frontend:$CI_COMMIT_SHORT_SHA" frontend/

# builds the backend image and pushes it directly to acr
backend-acr-build:
  <<: *acr-build-base
  script:
    - az login --service-principal --username "$ARM_CLIENT_ID" --federated-token "$ARM_OIDC_TOKEN" --tenant "$ARM_TENANT_ID"
    - az acr build --registry "$ACR_NAME" --image "backend:$CI_COMMIT_SHORT_SHA" backend/


terraform-plan:
  <<: *terraform-base
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bootstrap/**/*
        - infra/**/*
        - .gitlab-ci.yml
  script:
    - cd infra
    - terraform init -input=false
    - terraform plan -input=false -out=tfplan -var "frontend_image_tag=${CI_COMMIT_SHORT_SHA:-bootstrap}" -var "backend_image_tag=${CI_COMMIT_SHORT_SHA:-bootstrap}"
    - terraform show -no-color tfplan > plan.txt
  artifacts:
    when: always
    paths:
      - infra/plan.txt
      - infra/tfplan
      - infra/.terraform.lock.hcl
    expire_in: 1 week

# stage 3: test
# runs pytest and produces a coverage report (cobertura format for gitlab coverage display)
# skipped if no tests/ directory exists
python-test:
  <<: *rules-python
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r frontend/requirements.txt
    - pip install --quiet pytest pytest-cov
  script:
    - |
      if [ -d "frontend/tests" ]; then
        cd frontend && pytest --cov=app --cov-report=term --cov-report=xml
      else
        echo "No tests found, skipping step."
      fi
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage.xml
    expire_in: 1 week

# stage 4: deploy
# applies the terraform plan to the production environment, must be triggered manually in gitlab
terraform-apply:
  <<: *terraform-base
  stage: deploy
  needs:
    - job: terraform-plan
      artifacts: true
    - job: frontend-acr-build
      optional: true
    - job: backend-acr-build
      optional: true
  script:
    - cd infra
    - terraform init -input=false
    - terraform apply -input=false -auto-approve tfplan
  environment:
    name: production
    action: start
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

# creates a gitlab release entry when a semantic version tag (e.g. v1.2.3) is pushed
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - echo "Creating GitLab Release for tag $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      Automated release for tag **$CI_COMMIT_TAG**.

      Container image: `$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA`
      Pipeline: $CI_PIPELINE_URL

      See merge requests merged since the previous tag for details.
