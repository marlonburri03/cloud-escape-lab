stages:
  - debug
  - validate
  - scan
  - plan
  - apply
  - build
  - image-scan
  - deploy

workflow:
  rules:
    # allow merge request pipelines (for validation + security checks)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # allow main branch pipelines (for deployment)
    - if: $CI_COMMIT_BRANCH == "main"

default:
  tags:
    - saas-linux-small-amd64

variables:
  TF_DIR: "infra"
  TF_IN_AUTOMATION: "true"

# debug job to inspect oidc token claims in merge requests
debug:jwt:
  stage: debug
  image: alpine
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  rules:
    # only run in merge requests for troubleshooting oidc issues
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
  script:
    - apk add --no-cache jq
    # decode jwt payload for debugging claims like sub, ref, pipeline_source
    - |
      payload=$(echo "$GITLAB_OIDC_TOKEN" | cut -d '.' -f2)
      len=$((4 - ${#payload} % 4))
      [ "$len" -lt 4 ] && payload="${payload}$(printf '=%.0s' $(seq 1 $len))"
      echo "$payload" | base64 -d | jq '{sub,ref,ref_type,pipeline_source,aud}'

# terraform validation (format + syntax check)
terraform:validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.7.5
    entrypoint: [""]
  script:
    - cd $TF_DIR
    - terraform fmt -check
    - terraform init -backend=false
    - terraform validate
  rules:
    # run validation on merge requests and main branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# static security analysis for terraform code
checkov:scan:
  stage: scan
  image: python:3.12-slim
  needs:
    - terraform:validate
  before_script:
    - pip install --no-cache-dir checkov
  script:
    # run checkov with soft-fail to not block pipelines immediately
    - >
      checkov
      --directory $TF_DIR
      --framework terraform
      --output cli
      --output sarif
      --output-file-path console,checkov-report.sarif
      --soft-fail
      --compact
      --quiet
  artifacts:
    name: checkov-report
    paths:
      - checkov-report.sarif
    reports:
      sast: checkov-report.sarif
    expire_in: 7 days
    when: always
  allow_failure: true
  rules:
    # security scan runs on both MR and main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# terraform oidc authentication base template
.terraform_oidc: &terraform_oidc
  image:
    name: hashicorp/terraform:1.7.5
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    ARM_USE_OIDC: "true"
    ARM_OIDC_TOKEN: $GITLAB_OIDC_TOKEN
    TF_VAR_tenant_id: $ARM_TENANT_ID
    TF_VAR_subscription_id: $ARM_SUBSCRIPTION_ID
    TF_VAR_use_oidc: "true"
  before_script:
    # initialize terraform backend using oidc token
    - cd $TF_DIR
    - terraform init -backend-config="oidc_token=$GITLAB_OIDC_TOKEN"

# terraform plan only runs on main (prevents noisy MR infra changes)
terraform:plan:
  stage: plan
  image:
    name: hashicorp/terraform:1.7.5
    entrypoint: [""]
  needs:
    - checkov:scan
  script:
    - cd $TF_DIR
    - terraform plan -out=tfplan
    - terraform show -no-color tfplan > tfplan.txt
  artifacts:
    paths:
      - $TF_DIR/tfplan
      - $TF_DIR/tfplan.txt
    expire_in: 1 day
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# terraform apply is manual to prevent accidental production changes
terraform:apply:
  stage: apply
  image:
    name: hashicorp/terraform:1.7.5
    entrypoint: [""]
  script:
    - cd $TF_DIR
    - terraform apply -auto-approve tfplan
  dependencies:
    - terraform:plan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# build docker images and push to azure container registry using oidc auth
.build_oidc:
  image: registry.gitlab.com/<your-gitlab-group>/cloud-escape-lab/ci-build:latest
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    # resolve acr name from terraform config
    - export ACR_NAME=$(grep '^acr_name' infra/terraform.tfvars | tr -d ' "' | cut -d'=' -f2)
    - export ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
    # login to azure using federated oidc token
    - az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" --federated-token "$GITLAB_OIDC_TOKEN"
    - az account set --subscription "$ARM_SUBSCRIPTION_ID"
    # login docker to acr using access token
    - export ACR_TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
    - echo "$ACR_TOKEN" | docker login "$ACR_LOGIN_SERVER" -u 00000000-0000-0000-0000-000000000000 --password-stdin

build:backend:
  extends: .build_oidc
  stage: build
  script:
    - docker build -t "$ACR_LOGIN_SERVER/backend:$CI_COMMIT_SHORT_SHA" ./backend
    - docker push "$ACR_LOGIN_SERVER/backend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:frontend:
  extends: .build_oidc
  stage: build
  script:
    - docker build -t "$ACR_LOGIN_SERVER/frontend:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$ACR_LOGIN_SERVER/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# trivy scan for container images pulled from acr using oidc auth
.trivy_scan: &trivy_defaults
  image: registry.gitlab.com/<your-gitlab-group>/cloud-escape-lab/ci-build:latest
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache"
    TRIVY_SEVERITY: "HIGH,CRITICAL"
    TRIVY_IGNORE_UNFIXED: "true"
  cache:
    key: trivy-db-$CI_COMMIT_REF_SLUG
    paths:
      - .trivycache/
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    # authenticate to azure to fetch acr access token
    - export ACR_NAME=$(grep '^acr_name' infra/terraform.tfvars | tr -d ' "' | cut -d'=' -f2)
    - export ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
    - az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" --federated-token "$GITLAB_OIDC_TOKEN"
    - az account set --subscription "$ARM_SUBSCRIPTION_ID"
    - export TRIVY_USERNAME="00000000-0000-0000-0000-000000000000"
    - export TRIVY_PASSWORD=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)

trivy:scan:backend:
  <<: *trivy_defaults
  stage: image-scan
  needs:
    - build:backend
  script:
    # scan backend container image for vulnerabilities
    - >
      trivy image
      --image-src remote
      --format sarif
      --output trivy-backend.sarif
      "$ACR_LOGIN_SERVER/backend:$CI_COMMIT_SHORT_SHA"
    - >
      trivy image
      --image-src remote
      --format table
      "$ACR_LOGIN_SERVER/backend:$CI_COMMIT_SHORT_SHA"
  artifacts:
    name: trivy-backend-report
    paths:
      - trivy-backend.sarif
    reports:
      container_scanning: trivy-backend.sarif
    expire_in: 7 days
    when: always
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

trivy:scan:frontend:
  <<: *trivy_defaults
  stage: image-scan
  needs:
    - build:frontend
  script:
    # scan frontend container image for vulnerabilities
    - >
      trivy image
      --image-src remote
      --format sarif
      --output trivy-frontend.sarif
      "$ACR_LOGIN_SERVER/frontend:$CI_COMMIT_SHORT_SHA"
    - >
      trivy image
      --image-src remote
      --format table
      "$ACR_LOGIN_SERVER/frontend:$CI_COMMIT_SHORT_SHA"
  artifacts:
    name: trivy-frontend-report
    paths:
      - trivy-frontend.sarif
    reports:
      container_scanning: trivy-frontend.sarif
    expire_in: 7 days
    when: always
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# deploy application using terraform with injected image tags
deploy:images:
  stage: deploy
  image:
    name: hashicorp/terraform:1.7.5
    entrypoint: [""]
  environment:
    name: production
    url: https://your-app.example.com
  script:
    - cd $TF_DIR
    - terraform apply -auto-approve -var "frontend_image_tag=$CI_COMMIT_SHORT_SHA" -var "backend_image_tag=$CI_COMMIT_SHORT_SHA"
  dependencies:
    - build:backend
    - build:frontend
    - trivy:scan:backend
    - trivy:scan:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
