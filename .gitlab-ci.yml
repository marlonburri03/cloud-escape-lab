stages:
  - validate
  - plan
  - apply
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# -----------------------------
# GLOBAL DEFAULTS
# -----------------------------
default:
  tags:
    - saas-linux-small-amd64
  image: hashicorp/terraform:1.7

variables:
  TF_DIR: "infra"
  TF_IN_AUTOMATION: "true"

# -----------------------------
# TERRAFORM VALIDATION
# -----------------------------
terraform:validate:
  stage: validate
  script:
    - cd $TF_DIR
    - terraform fmt -check
    - terraform init -backend=false
    - terraform validate

# -----------------------------
# TERRAFORM PLAN
# -----------------------------
terraform:plan:
  stage: plan
  script:
    - cd $TF_DIR
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - infra/tfplan

# -----------------------------
# TERRAFORM APPLY (manual safety)
# -----------------------------
terraform:apply:
  stage: apply
  when: manual
  script:
    - cd $TF_DIR
    - terraform init
    - terraform apply -auto-approve tfplan
  dependencies:
    - terraform:plan

# -----------------------------
# BUILD BACKEND IMAGE
# -----------------------------
build:backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    IMAGE_NAME: "$ACR_LOGIN_SERVER/backend"
  script:
    - docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME -p $ACR_PASSWORD
    - docker build -t $IMAGE_NAME:$IMAGE_TAG ./backend
    - docker push $IMAGE_NAME:$IMAGE_TAG

# -----------------------------
# BUILD FRONTEND IMAGE
# -----------------------------
build:frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    IMAGE_NAME: "$ACR_LOGIN_SERVER/frontend"
  script:
    - docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME -p $ACR_PASSWORD
    - docker build -t $IMAGE_NAME:$IMAGE_TAG ./frontend
    - docker push $IMAGE_NAME:$IMAGE_TAG

# -----------------------------
# DEPLOY (Terraform re-apply with new image tags)
# -----------------------------
deploy:infra:
  stage: deploy
  image: hashicorp/terraform:1.7
  script:
    - cd $TF_DIR
    - terraform init
    - terraform apply -auto-approve
  dependencies:
    - build:backend
    - build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"