stages:
  - validate
  - plan
  - apply
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# global defaults
default:
  tags:
    - saas-linux-small-amd64

variables:
  TF_DIR: "infra"
  TF_IN_AUTOMATION: "true"

# oidc anchor reused across all terraform jobs that need azure
.terraform_oidc: &terraform_oidc
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    ARM_USE_OIDC: "true"
    ARM_OIDC_TOKEN: $GITLAB_OIDC_TOKEN
    TF_VAR_tenant_id: $ARM_TENANT_ID
    TF_VAR_subscription_id: $ARM_SUBSCRIPTION_ID
    TF_VAR_use_oidc: "true"
  before_script:
    - cd $TF_DIR
    - terraform init -backend-config="oidc_token=$GITLAB_OIDC_TOKEN"

# step 1 - validate: syntax and format check without backend connection
# runs on every push and every merge request
terraform:validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  script:
    - cd $TF_DIR
    - terraform fmt -check
    - terraform init -backend=false
    - terraform validate

# step 2 - plan: connects to azure and shows planned changes
# saves the plan as artifact for the apply step (main only)
terraform:plan:
  <<: *terraform_oidc
  stage: plan
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - infra/tfplan
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# step 3 - apply: applies the saved plan, requires manual trigger
terraform:apply:
  <<: *terraform_oidc
  stage: apply
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - terraform:plan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# step 4a - build backend: builds and pushes the backend image to acr
# tag: $CI_COMMIT_SHORT_SHA | requires: ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD
build:backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    IMAGE_NAME: "$ACR_LOGIN_SERVER/backend"
  script:
    - docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME -p $ACR_PASSWORD
    - docker build -t $IMAGE_NAME:$IMAGE_TAG ./backend
    - docker push $IMAGE_NAME:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# step 4b - build frontend: builds and pushes the frontend image to acr
build:frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    IMAGE_NAME: "$ACR_LOGIN_SERVER/frontend"
  script:
    - docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME -p $ACR_PASSWORD
    - docker build -t $IMAGE_NAME:$IMAGE_TAG ./frontend
    - docker push $IMAGE_NAME:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# step 5 - deploy: updates image tags via terraform apply
# each new tag automatically creates a new aca revision, requires manual trigger
deploy:images:
  <<: *terraform_oidc
  stage: deploy
  script:
    - >-
      terraform apply -auto-approve
      -var "frontend_image_tag=$CI_COMMIT_SHORT_SHA"
      -var "backend_image_tag=$CI_COMMIT_SHORT_SHA"
  dependencies:
    - build:backend
    - build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
