stages:
  - lint
  - build
  - test
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  tags:
    - saas-linux-small-amd64
  interruptible: true

.rules-python: &rules-python
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml

.rules-terraform: &rules-terraform
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bootstrap/**/*
        - infra/**/*
        - .gitlab-ci.yml

.rules-docker: &rules-docker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/Dockerfile
        - frontend/**/*
        - .gitlab-ci.yml

# Stage 1: Lint, Validate and Secret Scan
python-lint:
  <<: *rules-python
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check frontend/

terraform-fmt-validate:
  <<: *rules-terraform
  stage: lint
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive bootstrap/ infra/
    - cd infra && terraform init -backend=false && terraform validate
    - cd ../bootstrap && terraform init -backend=false && terraform validate

dockerfile-lint:
  <<: *rules-docker
  stage: lint
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint frontend/Dockerfile

secret-scan:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact --no-banner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Advanced Terraform linting (Azure-aware rules)
tflint:
  <<: *rules-terraform
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - tflint --init -c "$CI_PROJECT_DIR/.tflint.hcl"
    - tflint -c "$CI_PROJECT_DIR/.tflint.hcl" --chdir=infra
    - tflint -c "$CI_PROJECT_DIR/.tflint.hcl" --chdir=bootstrap

# Security & compliance scanning for Terraform
checkov:
  <<: *rules-terraform
  stage: lint
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - checkov -d infra --framework terraform --quiet --compact --soft-fail
    - checkov -d bootstrap --framework terraform --quiet --compact --soft-fail
  artifacts:
    when: always
    reports:
      sast: checkov-report.json
    expire_in: 1 week

# Filesystem & IaC vulnerability scan (CVEs in deps, misconfigurations)
trivy-fs:
  stage: lint
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 --scanners vuln,misconfig,secret .
  cache:
    paths:
      - .trivycache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Stage 2: Build
frontend-docker-build:
  <<: *rules-docker
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t "$IMAGE_TAG" frontend/
    # Push only on main (to GitLab Container Registry)
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
      fi

# Image CVE scan (runs only on main where the image was pushed)
trivy-image:
  stage: build
  needs: [frontend-docker-build]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | trivy registry login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 "$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.terraform-base: &terraform-base
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    ARM_USE_OIDC: "true"
    TF_IN_AUTOMATION: "true"

terraform-plan:
  <<: *terraform-base
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bootstrap/**/*
        - infra/**/*
        - .gitlab-ci.yml
  script:
    - cd infra
    - terraform init -input=false
    - terraform plan -input=false -out=tfplan
    - terraform show -no-color tfplan > plan.txt
  artifacts:
    when: always
    paths:
      - infra/plan.txt
      - infra/tfplan
      - infra/.terraform.lock.hcl
    expire_in: 1 week

# Stage 4: Deploy (only on main, manual approval)
terraform-apply:
  <<: *terraform-base
  stage: deploy
  needs:
    - job: terraform-plan
      artifacts: true
  script:
    - cd infra
    - terraform init -input=false
    - terraform apply -input=false -auto-approve tfplan
  environment:
    name: production
    action: start
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

# Stage 3: Test
python-test:
  <<: *rules-python
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r frontend/requirements.txt
    - pip install --quiet pytest pytest-cov
  script:
    - |
      if [ -d "frontend/tests" ]; then
        cd frontend && pytest --cov=app --cov-report=term --cov-report=xml
      else
        echo "No tests found, skipping step."
      fi
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage.xml
    expire_in: 1 week
