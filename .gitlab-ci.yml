stages:
  - validate
  - scan
  - plan
  - apply
  - build
  - image-scan
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  tags:
    - saas-linux-small-amd64

variables:
  TF_DIR: "infra"
  TF_IN_AUTOMATION: "true"

# anchor: oidc build (custom ci image with azure-cli + docker-cli)
.build_oidc:
  image: registry.gitlab.com/<your-gitlab-group>/cloud-escape-lab/ci-build:latest
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - export ACR_NAME=$(grep '^acr_name' infra/terraform.tfvars | tr -d ' "' | cut -d'=' -f2)
    - export ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
    - az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" --federated-token "$GITLAB_OIDC_TOKEN"
    - az account set --subscription "$ARM_SUBSCRIPTION_ID"
    - export ACR_TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
    - echo "$ACR_TOKEN" | docker login "$ACR_LOGIN_SERVER" -u 00000000-0000-0000-0000-000000000000 --password-stdin

# anchor: terraform oidc
.terraform_oidc: &terraform_oidc
  image:
    name: hashicorp/terraform:1.7.5
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    ARM_USE_OIDC: "true"
    ARM_OIDC_TOKEN: $GITLAB_OIDC_TOKEN
    TF_VAR_tenant_id: $ARM_TENANT_ID
    TF_VAR_subscription_id: $ARM_SUBSCRIPTION_ID
    TF_VAR_use_oidc: "true"
  before_script:
    - cd $TF_DIR
    - terraform init -backend-config="oidc_token=$GITLAB_OIDC_TOKEN"

# stage: validate
terraform:validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.7.5
    entrypoint: [""]
  script:
    - cd $TF_DIR
    - terraform fmt -check
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# stage: scan - checkov iac security scanning
checkov:scan:
  stage: scan
  image: python:3.12-slim
  needs:
    - terraform:validate
  before_script:
    - pip install --no-cache-dir checkov
  script:
    - >
      checkov
      --directory $TF_DIR
      --framework terraform
      --output cli
      --output sarif
      --output-file-path console,checkov-report.sarif
      --soft-fail
      --compact
      --quiet
  artifacts:
    name: checkov-report
    paths:
      - checkov-report.sarif
    reports:
      sast: checkov-report.sarif
    expire_in: 7 days
    when: always
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# stage: plan
terraform:plan:
  <<: *terraform_oidc
  stage: plan
  needs:
    - checkov:scan
  script:
    - terraform plan -out=tfplan
    - terraform show -no-color tfplan > tfplan.txt
  artifacts:
    paths:
      - $TF_DIR/tfplan
      - $TF_DIR/tfplan.txt
    expire_in: 1 day
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# stage: apply
terraform:apply:
  <<: *terraform_oidc
  stage: apply
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - terraform:plan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# stage: build
build:backend:
  extends: .build_oidc
  stage: build
  script:
    - docker build -t "$ACR_LOGIN_SERVER/backend:$CI_COMMIT_SHORT_SHA" ./backend
    - docker push "$ACR_LOGIN_SERVER/backend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:frontend:
  extends: .build_oidc
  stage: build
  script:
    - docker build -t "$ACR_LOGIN_SERVER/frontend:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$ACR_LOGIN_SERVER/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# stage: image-scan - trivy container scanning
.trivy_scan: &trivy_defaults
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache"
    TRIVY_SEVERITY: "HIGH,CRITICAL"
    TRIVY_EXIT_CODE: "1"
    TRIVY_IGNORE_UNFIXED: "true"
  cache:
    key: trivy-db-$CI_COMMIT_REF_SLUG
    paths:
      - .trivycache/
  before_script:
    - export ACR_NAME=$(grep '^acr_name' infra/terraform.tfvars | tr -d ' "' | cut -d'=' -f2)
    - export ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"

trivy:scan:backend:
  <<: *trivy_defaults
  stage: image-scan
  needs:
    - build:backend
  script:
    - >
      trivy image
      --format sarif
      --output trivy-backend.sarif
      "$ACR_LOGIN_SERVER/backend:$CI_COMMIT_SHORT_SHA"
    - >
      trivy image
      --format table
      "$ACR_LOGIN_SERVER/backend:$CI_COMMIT_SHORT_SHA"
  artifacts:
    name: trivy-backend-report
    paths:
      - trivy-backend.sarif
    reports:
      container_scanning: trivy-backend.sarif
    expire_in: 7 days
    when: always
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

trivy:scan:frontend:
  <<: *trivy_defaults
  stage: image-scan
  needs:
    - build:frontend
  script:
    - >
      trivy image
      --format sarif
      --output trivy-frontend.sarif
      "$ACR_LOGIN_SERVER/frontend:$CI_COMMIT_SHORT_SHA"
    - >
      trivy image
      --format table
      "$ACR_LOGIN_SERVER/frontend:$CI_COMMIT_SHORT_SHA"
  artifacts:
    name: trivy-frontend-report
    paths:
      - trivy-frontend.sarif
    reports:
      container_scanning: trivy-frontend.sarif
    expire_in: 7 days
    when: always
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# stage: deploy
deploy:images:
  <<: *terraform_oidc
  stage: deploy
  environment:
    name: production
    url: https://your-app.example.com
  script:
    - >
      terraform apply -auto-approve
      -var "frontend_image_tag=$CI_COMMIT_SHORT_SHA"
      -var "backend_image_tag=$CI_COMMIT_SHORT_SHA"
  dependencies:
    - build:backend
    - build:frontend
    - trivy:scan:backend
    - trivy:scan:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
